name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify privacy CSP is present in the built app
        run: grep -q "connect-src 'self'" dist/index.html
      - name: Verify decoders are bundled, not fetched from a CDN
        run: |
          test -f dist/decoders/draco/draco_decoder.wasm
          test -f dist/decoders/basis/basis_transcoder.wasm
          ! grep -rEl "https://www\.gstatic\.com|unpkg\.com|cdn\.jsdelivr" dist/assets
